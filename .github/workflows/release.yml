name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
            ext: ""
            archive: tar.gz
          - os: windows-2022
            name: windows-x86_64
            ext: ".exe"
            archive: zip
          - os: macos-13
            name: macos-x86_64
            ext: ""
            archive: tar.gz
          - os: macos-14
            name: macos-aarch64
            ext: ""
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Build magic-bevy
        shell: bash
        run: cargo build --release -p magic-bevy --bin magic-bevy

      - name: Package release
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp "target/release/magic-bevy${{ matrix.ext }}" dist/

          if [ "${{ matrix.archive }}" = "zip" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path 'dist/*' -DestinationPath 'magic-bevy-${VERSION}-${{ matrix.name }}.zip' -Force"
          else
            tar -czf "magic-bevy-${VERSION}-${{ matrix.name }}.tar.gz" -C dist .
          fi

          echo "ASSET=magic-bevy-${VERSION}-${{ matrix.name }}.${{ matrix.archive }}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: magic-bevy-${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true