[workspace]
members = [
    "magic_api_editor",
    "magic_api_runtime",
    "magic_core",
    "magic_editor",
    "magic_log",
    "magic_pkg",
    "magic_runtime"
]
resolver = "2"

[workspace.dependencies]
egui = "0.36"
eframe = "0.36"
egui-phosphor = "0.14"
egui_dock = { version = "0.21", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.6"
notify = "8.1.0"

[package]
name = "magic-bevy"
version = "0.1.0"
edition = "2024"

[dependencies]
magic_core = { path = "magic_core" }
magic_pkg = { path = "magic_pkg" }
magic_log = { path = "magic_log" }

libloading = "0.8"
eframe = { workspace = true }
egui = { workspace = true }
egui-phosphor = { workspace = true }
egui_dock = { workspace = true }
notify = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.magic_fast]
inherits = "dev"
opt-level = 0
debug = 0
incremental = true

[profile.magic_fast.package."*"]
opt-level = 0
