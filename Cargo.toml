[workspace]
members = [
    "magic_core",
    "magic_editor",   
    "magic_pkg"
]
resolver = "2"

[package]
name = "magic-bevy"
version = "0.1.0"
edition = "2024"

[dependencies]
magic_core = { path = "magic_core" }
magic_pkg = { path = "magic_pkg" }

libloading = "0.8"
eframe = "0.36"
egui = "0.36"
egui_dock = { version = "0.21", features = ["serde"] }
notify = "8.1.0"
serde_json = "1"
